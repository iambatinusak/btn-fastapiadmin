<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Sign In — {{ admin.title }}</title>
  <style>
    :root{
      --primary: {{ admin.brand_color }};
      --primary-rgb: 99,102,241;
      --border:#e2e8f0;--text:#0f172a;--text-2:#475569;--text-3:#94a3b8;
      --surface:#fff;--bg:#f1f5f9;--danger:#ef4444;--radius:10px;
      --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
      --shadow-lg:0 20px 50px rgba(0,0,0,.12);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
      background:var(--bg);color:var(--text);min-height:100vh;
      display:flex;align-items:center;justify-content:center;}

    .login-wrap{width:100%;max-width:380px;padding:20px;}

    .login-logo{text-align:center;margin-bottom:30px;}
    .login-logo-mark{width:48px;height:48px;border-radius:13px;background:var(--primary);
      display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;
      box-shadow:0 8px 20px rgba(var(--primary-rgb),.35);}
    .login-logo-mark svg{color:white;}
    .login-title{font-size:22px;font-weight:800;letter-spacing:-.02em;}
    .login-sub{font-size:13.5px;color:var(--text-2);margin-top:5px;}

    .login-card{background:var(--surface);border:1px solid var(--border);
      border-radius:14px;padding:28px;box-shadow:var(--shadow-lg);}

    .form-group{margin-bottom:16px;}
    .form-label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px;}
    .form-control{width:100%;padding:10px 13px;border:1px solid var(--border);
      border-radius:8px;font-size:14px;color:var(--text);background:#fff;
      outline:none;transition:border-color .15s,box-shadow .15s;font-family:inherit;}
    .form-control:focus{border-color:var(--primary);
      box-shadow:0 0 0 3px rgba(var(--primary-rgb),.12);}

    .btn-login{display:flex;align-items:center;justify-content:center;gap:8px;
      width:100%;padding:11px;border:none;border-radius:8px;
      background:var(--primary);color:#fff;font-size:14.5px;font-weight:600;
      cursor:pointer;transition:filter .14s;margin-top:6px;}
    .btn-login:hover{filter:brightness(1.08);}

    .error-box{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;
      padding:11px 14px;border-radius:8px;font-size:13.5px;margin-bottom:16px;
      display:flex;align-items:center;gap:9px;}
    .error-box svg{flex-shrink:0;width:16px;height:16px;}

    .login-footer{text-align:center;margin-top:20px;font-size:12.5px;color:var(--text-3);}
  </style>
</head>
<body>
<div class="login-wrap">
  <div class="login-logo">
    <div class="login-logo-mark">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <rect x="3" y="3" width="7" height="7" rx="1.5"/>
        <rect x="14" y="3" width="7" height="7" rx="1.5"/>
        <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5"/>
      </svg>
    </div>
    <div class="login-title">{{ admin.title }}</div>
    <div class="login-sub">Sign in to continue</div>
  </div>

  <div class="login-card">
    {% if error %}
    <div class="error-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="{{ admin.prefix }}/login">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input class="form-control" id="username" name="username" type="text"
               autocomplete="username" autofocus required placeholder="admin"/>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" name="password" type="password"
               autocomplete="current-password" required placeholder="••••••••"/>
      </div>
      <button class="btn-login" type="submit">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/>
          <line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        Sign In
      </button>
    </form>
  </div>

  <div class="login-footer">
    Powered by <strong>fastapiadmin</strong>
  </div>
</div>
</body>
</html>
