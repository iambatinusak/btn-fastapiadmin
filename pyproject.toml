[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btn_fastapiadmin"
version = "0.1.0"
description = "A beautiful, minimal admin panel for FastAPI + SQLAlchemy"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "FastAPI Admin", email = "admin@fastapiadmin.dev" }]
keywords = ["fastapi", "admin", "sqlalchemy", "panel", "crud"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "sqlalchemy>=2.0.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    "itsdangerous>=2.1.0",
    "starlette>=0.27.0",
]

[project.optional-dependencies]
dev = ["uvicorn[standard]", "httpx"]

[project.urls]
Homepage = "https://github.com/fastapiadmin/fastapiadmin"
Repository = "https://github.com/fastapiadmin/fastapiadmin"

[tool.setuptools.packages.find]
where = ["."]
include = ["fastapiadmin*"]

[tool.setuptools.package-data]
fastapiadmin = ["templates/**/*.html", "static/**/*"]
